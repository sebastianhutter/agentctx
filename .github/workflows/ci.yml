name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Runs first and on its own: a leaked customer name is permanent once
      # merged, so it should fail before anything else spends time. See Rule 0.
      - name: Check for leaked names
        run: make check-names

      - run: make build
      - run: make test

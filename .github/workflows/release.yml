name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.2.0)"
        required: true
        default: "0.0.0-test"

permissions:
  contents: write

env:
  GO_VERSION: "1.27"

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: make test

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binary
        run: make build VERSION=${{ steps.version.outputs.VERSION }}

      - name: Check the version was stamped
        run: |
          # A broken ldflags path fails silently and ships binaries that all
          # claim to be "dev", which makes a bug report unanswerable.
          got=$(./bin/agentctx --version)
          echo "$got"
          case "$got" in
            *"${{ steps.version.outputs.VERSION }}"*) ;;
            *) echo "version not stamped into the binary"; exit 1 ;;
          esac

      - name: Build .app bundle
        run: make app VERSION=${{ steps.version.outputs.VERSION }}

      - name: Build DMG
        run: make dmg VERSION=${{ steps.version.outputs.VERSION }}

      - name: Rename binary
        run: mv bin/agentctx bin/agentctx-darwin-arm64

      - name: Zip .app bundle
        run: cd bin && zip -qr agentctx-darwin-arm64.app.zip agentctx.app

      - name: Checksums
        run: cd bin && shasum -a 256 agentctx-darwin-arm64 agentctx-darwin-arm64.app.zip agentctx.dmg > SHA256SUMS && cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            bin/agentctx-darwin-arm64
            bin/agentctx-darwin-arm64.app.zip
            bin/agentctx.dmg
            bin/SHA256SUMS

  release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/agentctx.dmg \
            artifacts/agentctx-darwin-arm64.app.zip \
            artifacts/agentctx-darwin-arm64 \
            artifacts/SHA256SUMS

      - name: List artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        run: ls -lh artifacts/
